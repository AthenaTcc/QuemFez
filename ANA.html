<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ANA</title>
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    color-scheme: dark;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: #000;
  }
  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  h1 {
    margin: 0;
    color: #fff;
    font-size: 3rem;
    font-weight: 600;
    text-transform: uppercase;
    text-align: center;
  }
  button {
    padding: 10px 32px;
    font-size: 1rem;
    font-weight: 700;
    color: #000;
    background: #fff;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    transition: transform 0.08s ease, background 0.08s ease, box-shadow 0.08s ease;
  }
  button:active {
    transform: scale(0.94);
    background: #bbb;
    box-shadow: inset 0 3px 8px rgba(0, 0, 0, 0.45);
  }
  button {
    -webkit-user-select: none;
    user-select: none;
    -webkit-touch-callout: none;
    touch-action: manipulation;
  }
  /* cores invertidas enquanto o botão está apertado */
  html.inv, html.inv body { background: #fff; }
  html.inv h1 { color: #000; }
  html.inv button {
    background: #000;
    color: #fff;
  }
  html.inv button:active {
    background: #444;
    box-shadow: inset 0 3px 8px rgba(255, 255, 255, 0.3);
  }
  .confetti {
    position: fixed;
    left: 0;
    top: 0;
    width: 8px;
    height: 14px;
    pointer-events: none;
    z-index: 10;
  }
</style>
</head>
<body>
  <h1>ANA<br>DAVI</h1>
  <button type="button">OK!</button>
<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('button');
  var colors = ['#ff3b5c', '#ffd23f', '#3bceac', '#4d9de0', '#ff8c42', '#b86bff', '#7bd88f'];

  function burst() {
    var r = btn.getBoundingClientRect();
    var cx = r.left + r.width / 2;
    var cy = r.top + r.height / 2;
    for (var i = 0; i < 90; i++) {
      var el = document.createElement('div');
      el.className = 'confetti';
      el.style.background = colors[Math.floor(Math.random() * colors.length)];
      if (Math.random() < 0.3) el.style.borderRadius = '50%';
      document.body.appendChild(el);
      var angle = -Math.PI / 2 + (Math.random() - 0.5) * Math.PI * 1.1;
      var power = 150 + Math.random() * 300;
      var dx = Math.cos(angle) * power;
      var dy = Math.sin(angle) * power;
      var fall = window.innerHeight - cy + 80 + Math.random() * 100;
      var rot = (Math.random() - 0.5) * 1440;
      var dur = 1400 + Math.random() * 1200;
      var anim = el.animate([
        { transform: 'translate(' + cx + 'px,' + cy + 'px) rotate(0deg)', opacity: 1, easing: 'ease-out' },
        { transform: 'translate(' + (cx + dx) + 'px,' + (cy + dy) + 'px) rotate(' + (rot / 2) + 'deg)', opacity: 1, offset: 0.4, easing: 'ease-in' },
        { transform: 'translate(' + (cx + dx * 1.3) + 'px,' + (cy + fall) + 'px) rotate(' + rot + 'deg)', opacity: 0.9 }
      ], { duration: dur, fill: 'forwards' });
      anim.onfinish = (function (e) { return function () { e.remove(); }; })(el);
    }
  }

  btn.addEventListener('click', function () {
    root.classList.toggle('inv');
    burst();
  });
  btn.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
